<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="space-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4f46e5" stop-opacity="0.45"/>
      <stop offset="60%" stopColor="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stopColor="#080b13" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Core Gradient -->
    <linearGradient id="star-core" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stopColor="#a78bfa"/>
      <stop offset="45%" stopColor="#818cf8"/>
      <stop offset="100%" stopColor="#38bdf8"/>
    </linearGradient>

    <!-- Planetary Orbit Ring Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stop-opacity="0.95"/>
      <stop offset="40%" stopColor="#818cf8" stop-opacity="0.7"/>
      <stop offset="75%" stopColor="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stopColor="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="100" height="100" rx="26" fill="#080b13"/>
  <rect x="1" y="1" width="98" height="98" rx="25" stroke="#1f293d" stroke-width="2"/>

  <!-- Core Ambient Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#space-glow)"/>

  <!-- Orbit Ring Back (tilted ellipse -28deg) -->
  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="38" ry="13" stroke="url(#orbit-grad)" stroke-width="2.6" stroke-dasharray="80 160" stroke-linecap="round"/>
  </g>

  <!-- Central Planet Core Disc -->
  <circle cx="50" cy="50" r="22" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>

  <!-- Antigravity Core 4-Point Star (nested inside planetary gravity well) -->
  <path d="M50 29 C50 40.5 40.5 50 29 50 C40.5 50 50 59.5 50 71 C50 59.5 59.5 50 71 50 C59.5 50 50 40.5 50 29 Z" fill="url(#star-core)"/>
  <circle cx="50" cy="50" r="3.2" fill="#ffffff" opacity="0.95"/>

  <!-- Orbit Ring Front (wrapping in front of planet) -->
  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="38" ry="13" stroke="url(#orbit-grad)" stroke-width="2.6" stroke-dasharray="130 110" stroke-dashoffset="120" stroke-linecap="round"/>
    
    <!-- Pocket Satellite Device Orbiting on the Ring (Upper Right Node) -->
    <g transform="translate(84, 50)">
      <!-- Beacon Glow Pulse -->
      <circle cx="0" cy="0" r="7" fill="#38bdf8" opacity="0.35"/>
      <!-- Mobile Phone Silhouette / Beacon -->
      <rect x="-4" y="-6.5" width="8" height="13" rx="2" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="-2.2" y="-4.5" width="4.4" height="7.5" rx="0.8" fill="#38bdf8" opacity="0.95"/>
      <circle cx="0" cy="4.2" r="0.6" fill="#ffffff"/>
    </g>
  </g>
</svg>
